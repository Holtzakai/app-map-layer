<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="地点に関係する情報を複数GeoJSONから横断検索する静的APIのプロトタイプ">
    <title>app-map-layer</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">GeoJSON cross-search prototype</p>
        <h1>app-map-layer</h1>
        <p>指定した地点を含む区域と、周辺の地点・経路情報を、複数の地理データから一度に検索します。</p>
      </header>

      <aside role="note">
        <strong>デモ用の架空データです。</strong> 実際の避難・防災判断には使用できません。
      </aside>

      <form id="search-form">
        <fieldset>
          <legend>検索地点</legend>
          <div class="coordinate-grid">
            <label>経度<input id="longitude" name="longitude" type="number" value="139.7588" min="-180" max="180" step="any" required></label>
            <label>緯度<input id="latitude" name="latitude" type="number" value="35.6824" min="-90" max="90" step="any" required></label>
            <label>検索半径（m）<input id="radius" name="radius" type="number" value="1000" min="0" max="100000" step="100" required></label>
          </div>
          <button id="use-current-location" class="secondary" type="button">現在地を使う</button>
          <p id="location-status" class="status" aria-live="polite"></p>
        </fieldset>
        <label for="query">キーワード（任意）</label>
        <input id="query" name="query" type="search" placeholder="例: 洪水、熱中症、中央" autocomplete="off">
        <button class="submit" type="submit">この地点を横断検索</button>
      </form>

      <section aria-labelledby="result-heading">
        <div class="section-heading">
          <h2 id="result-heading">検索結果</h2>
          <span id="result-count" aria-live="polite">読み込み中</span>
        </div>
        <div id="results"></div>
      </section>

      <footer>
        <a href="./api/v1/catalog.json">データカタログ</a>
        <a href="./api/v1/all.geojson">全GeoJSON</a>
      </footer>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
